# /Users/lasse/Sites/todo-elephant/nginx/nginx.conf
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  # Basic Settings
  sendfile on;
  tcp_nopush on;
  types_hash_max_size 2048;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  include /etc/nginx/modules-enabled/*.conf;

  server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;

  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    SSL configuration
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_prefer_server_ciphers on;
      ssl_preload_credentials on;
      ssl_session_cache shared:SSL:10m;
      ssl_session_timeout 10m;
      ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20:ECDHE+AES256:ECDHE+AES128:!ECDHE+DES CBC3;
      ssl_session_tickets shared:SSL:10m;
      ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: https://*; font-src 'self' https://*; connect-src 'self' https: wss:; object-src 'none'; frame-ancestors 'none';";

    # Performance Optimizations
    keepalive_timeout 75;
    keepalive_requests 100;
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json;

    # Virtual Host Configuration
    server_name _;

    location /api/ {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bust=1;
      proxy_ignore_headers Set-Cookie;
      proxy_buffering 0;
    }

    location / {
      proxy_pass http://api/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bust=1;
      proxy_buffering 0;
    }

    # Static Files
    location /api/upload/ {
      alias /app/uploads/;
      expires 1y;
      access_control_allow_origin *;
    }

    location /api/health {
      proxy_pass http://api/health;
      proxy_set_header Host $host;
    }

    # Static Files from build
    location /static/ {
      alias /app/.next/static/chunks/;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }