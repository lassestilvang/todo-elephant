<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Todo Elephant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
    }

    .elephant-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    p {
      color: #94a3b8;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    .retry-btn {
      background: #22c55e;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .retry-btn:hover {
      background: #16a34a;
    }

    .features {
      margin-top: 2rem;
      text-align: left;
      font-size: 0.875rem;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid #1e293b;
    }

    .feature:last-child {
      border-bottom: none;
    }

    .feature-check {
      color: #22c55e;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="elephant-icon">🐘</div>
    <h1>You're Offline</h1>
    <p>Don't worry, Todo Elephant works offline! Your data is safely stored locally and will sync when you're back online.</p>

    <button class="retry-btn" onclick="window.location.reload()">
      Try Again
    </button>

    <div class="features">
      <div class="feature">
        <span class="feature-check">✓</span>
        <span>View your tasks</span>
      </div>
      <div class="feature">
        <span class="feature-check">✓</span>
        <span>Add new tasks</span>
      </div>
      <div class="feature">
        <span class="feature-check">✓</span>
        <span>Complete tasks</span>
      </div>
      <div class="feature">
        <span class="feature-check">✓</span>
        <span>Sync when online</span>
      </div>
    </div>
  </div>

  <script>
    // Check for online status
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
